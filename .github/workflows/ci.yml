name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ekp
          POSTGRES_PASSWORD: ekp_ci_test
          POSTGRES_DB: ekp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql://ekp:ekp_ci_test@localhost:5432/ekp_test
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Postgres to be ready
        run: until pg_isready -h localhost -p 5432 -U ekp; do sleep 1; done

      - name: Run unit tests
        run: python -m pytest app/tests/ -v

      - name: Build Docker image
        run: docker build -t ekp-app:ci-${{ github.sha }} .

      - name: Smoke test the built image
        run: |
          docker run -d --name ekp-smoke-test \
            --network host \
            -e DATABASE_URL="postgresql://ekp:ekp_ci_test@localhost:5432/ekp_test" \
            -e QDRANT_HOST=localhost \
            -e QDRANT_PORT=6333 \
            ekp-app:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 30s - dumping container logs:"
          docker logs ekp-smoke-test
          exit 1

      - name: Clean up smoke test container
        if: always()
        run: docker rm -f ekp-smoke-test || true
