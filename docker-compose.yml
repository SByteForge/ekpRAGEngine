version: "3.9"
 
services:
  postgres:
    image: postgres:16-alpine
    container_name: ekp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekp_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ekp}
    ports:
      - "5432:5432"
    volumes:
      - ekp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekp}"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: ekp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ekp_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekp-app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ekp}:${POSTGRES_PASSWORD:-ekp_local_dev}@postgres:5432/${POSTGRES_DB:-ekp}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_GEN_MODEL: ${OLLAMA_GEN_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-llama3.2:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./golden_set:/app/golden_set
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
 
volumes:
  ekp_pg_data:
  ekp_qdrant_data:
